<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKEDEX</title>

    <link rel="stylesheet" href="style.css"/>
     <link rel="stylesheet" href="css/font.css"/>

    <link rel="icon" type="image/png" href="img/favicon.png"/>

    <script src="script/template.js"></script>
    <script src="script.js" defer></script>
</head>

<body onload="init()">
    <header class="header">
      <div class="head">
        <img class="logo" src="img/logo.png" alt="Logo"/>
        <input type="text" id="search-bar" data-id="search-input" oninput="filterPokemons()" placeholder="Search...">
        <img class="logo1" src="img/pokedex.png" alt="Pokedex"/>
      </div>
    </header>
    
    <main class="container">
       <div class="main-container" id="pokemon-container" data-id="content">
       </div>
    </main>
    

    <div id="loading-spinner" class="loader d-none">
        <div class="spinner"></div>
    </div>

    <dialog id="pokemonDialog" data-id="dialog" aria-label="Pokemon details dialog"></dialog>

    <footer class="footer">
       <div class="main-footer">
        <img class="logo" src="img/logo.png" alt="Logo"/>

        <div class="load-more-container">
            <button id="loadMoreBtn" data-id="load-more-button"  aria-label="Load more pokemons" onclick="loadMorePokemons()">Load More</button>
            <a href="impressum.html" class="impressum-link">Impressum</a>
        </div>
        
        
        <div class="buttons">
        <button class="back-to-top" onclick="scrollToTop()" role="button" aria-label="Back to top">
        <img src="img/arrow-up.png" alt="top"></button>
        </div>
       </div> 
    </footer>
</body>
</html>
